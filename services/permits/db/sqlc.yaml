version: "2"
sql:
  - engine: "postgresql"
    queries: "query.sql"
    schema: "migrations"
    gen:
      go:
        package: "permitsdb"
        out: "generated"
        emit_json_tags: true
        emit_params_struct_pointers: true
        emit_result_struct_pointers: true
        null_style: "sql"
