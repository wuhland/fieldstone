version: "3.9"

# Development overrides: expose internal ports, use text logging, enable hot reload
services:
  postgres:
    ports:
      - "5432:5432"

  nats:
    ports:
      - "4222:4222"
      - "8222:8222"

  gateway:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    volumes:
      - ..:/app

  identity:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8084:8084"

  permits:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8081:8081"

  requests:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8082:8082"

  records:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8083:8083"

  workflow:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8085:8085"

  webhooks:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8086:8086"

  audit:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8087:8087"

  notify:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8088:8088"
