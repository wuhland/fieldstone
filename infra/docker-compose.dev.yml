# Development overrides: expose internal ports, use text logging, enable hot reload
services:
  postgres:
    ports:
      - "5433:5432"  # host 5433 avoids conflict with a local postgres on 5432

  pgbouncer:
    ports:
      - "5434:5432"  # connect from host: psql -h localhost -p 5434 -U fieldstone -d identity

  nats:
    ports:
      - "4222:4222"
      - "8222:8222"

  gateway:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    volumes:
      - ..:/app

  identity:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8084:8084"

  permits:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8081:8081"

  requests:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8082:8082"

  records:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8083:8083"

  workflow:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8085:8085"

  webhooks:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8086:8086"

  audit:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8087:8087"

  notify:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: debug
    ports:
      - "8088:8088"

  redis:
    ports:
      - "6379:6379"

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3001:3000"  # 3001 to avoid collision with the frontend on 3000
