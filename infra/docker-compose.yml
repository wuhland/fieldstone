x-healthcheck-defaults: &hc-defaults
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

# Services that write to the database route through PgBouncer for connection
# pooling. Services that only read config (workflow) or have no DB (gateway,
# notify) connect to NATS only and are listed separately.
x-db-depends: &db-depends
  pgbouncer:
    condition: service_healthy
  nats:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
    restart: unless-stopped

  pgbouncer:
    build:
      context: pgbouncer
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "nc -z localhost 5432 || exit 1"]
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    command: nats-server -js -m 8222 -sd /data/jetstream
    volumes:
      - nats_data:/data/jetstream
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    env_file: ../.env
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ../config/services.yaml:/etc/fieldstone/services.yaml:ro
    restart: unless-stopped
    profiles: ["core"]

  identity:
    build:
      context: ..
      dockerfile: services/identity/Dockerfile
    env_file: ../.env
    depends_on:
      <<: *db-depends
    restart: unless-stopped
    profiles: ["core"]

  permits:
    build:
      context: ..
      dockerfile: services/permits/Dockerfile
    env_file: ../.env
    depends_on:
      <<: *db-depends
    restart: unless-stopped
    profiles: ["permits"]

  requests:
    build:
      context: ..
      dockerfile: services/requests/Dockerfile
    env_file: ../.env
    depends_on:
      <<: *db-depends
    restart: unless-stopped
    profiles: ["requests"]

  records:
    build:
      context: ..
      dockerfile: services/records/Dockerfile
    env_file: ../.env
    depends_on:
      <<: *db-depends
    restart: unless-stopped
    profiles: ["records"]

  temporal:
    image: temporalio/temporal:latest
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      - SKIP_DEFAULT_NAMESPACE_CREATION=false
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig.yaml
    volumes:
      - ./temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "nc -z localhost 7233 || exit 1"]
      start_period: 30s
    restart: unless-stopped
    profiles: ["core"]

  temporal-ui:
    image: temporalio/ui:latest
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8233:8080"
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["core"]

  swagger-ui:
    image: swaggerapi/swagger-ui
    environment:
      SWAGGER_JSON: /openapi.json
    volumes:
      - ../services/gateway/docs/swagger.json:/openapi.json:ro
    restart: unless-stopped
    profiles: ["core"]

  workflow-worker:
    build:
      context: ..
      dockerfile: services/workflow-worker/Dockerfile
    env_file: ../.env
    volumes:
      - ../config/workflows:/etc/fieldstone/workflows:ro
    depends_on:
      temporal:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    ports:
      - "8085:8085"
    restart: unless-stopped
    profiles: ["core"]

  webhooks:
    build:
      context: ..
      dockerfile: services/webhooks/Dockerfile
    env_file: ../.env
    depends_on:
      <<: *db-depends
    restart: unless-stopped
    profiles: ["webhooks"]

  audit:
    build:
      context: ..
      dockerfile: services/audit/Dockerfile
    env_file: ../.env
    depends_on:
      <<: *db-depends
    restart: unless-stopped
    profiles: ["core"]

  notify:
    build:
      context: ..
      dockerfile: services/notify/Dockerfile
    env_file: ../.env
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["notify"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    env_file: ../.env
    depends_on:
      - gateway
    restart: unless-stopped
    profiles: ["core"]

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
      - frontend
    restart: unless-stopped
    profiles: ["core"]

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "redis-cli", "ping"]
    restart: unless-stopped
    profiles: ["core"]

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-fieldstone}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles: ["observability"]

volumes:
  postgres_data:
  temporal_data:
  nats_data:
  caddy_data:
  caddy_config:
  redis_data:
  prometheus_data:
  grafana_data:
