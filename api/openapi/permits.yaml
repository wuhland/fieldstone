openapi: "3.1.0"
info:
  title: Fieldstone Permits Service
  version: "0.1.0"
  description: Internal service API for permit applications and inspections.

servers:
  - url: /v1

components:
  schemas:
    Permit:
      type: object
      required: [id, permit_type, status, applicant, property_address, submitted_at]
      properties:
        id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        permit_type:
          type: string
        status:
          type: string
        applicant:
          type: object
        property_address:
          type: string
        metadata:
          type: object
        submitted_at:
          type: string
          format: date-time
        issued_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true

    Inspection:
      type: object
      required: [id, permit_id, inspector_id, scheduled_at]
      properties:
        id:
          type: string
          format: uuid
        permit_id:
          type: string
          format: uuid
        inspector_id:
          type: string
          format: uuid
        scheduled_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        result:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

paths:
  /permits:
    get:
      summary: List permits
      responses:
        "200":
          description: List of permits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permit"
    post:
      summary: Create permit
      responses:
        "201":
          description: Permit created
        "501":
          description: Not implemented

  /permits/{id}:
    get:
      summary: Get permit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Permit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permit"
        "404":
          description: Not found

  /permits/{id}/status:
    patch:
      summary: Update permit status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
      responses:
        "200":
          description: Status updated
        "422":
          description: Transition not allowed
